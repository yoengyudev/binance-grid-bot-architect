services:
  bot:
    build: .
    image: binance-grid-bot-architect:local
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      GRID_BOT_CONFIG_PATH: /data/config.json
      GRID_BOT_DB_PATH: /data/grid_bot.sqlite3
    volumes:
      - ./docker-data:/data
      - ./.env:/app/.env:ro
