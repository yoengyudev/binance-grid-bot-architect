services:
  bot:
    build: .
    image: binance-grid-bot-architect:local
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      GRID_BOT_CONFIG_PATH: /data/config.json
      GRID_BOT_DB_DIR: /data
      BOT_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persist config.json, grid_testnet.sqlite, grid_mainnet.sqlite and their
      # SQLite WAL/SHM files together. TRADING_ENVIRONMENT selects one ledger.
      - type: bind
        source: ./docker-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
